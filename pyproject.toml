[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-decode-scheduler"
version = "0.1.0"
description = "Compact task planning and persistent paged GQA decode for SGLang"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.5,<2.7", "triton>=3.1,<3.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
sglang = ["sglang==0.4.6.post5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: launches GPU kernels; opt in explicitly"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
